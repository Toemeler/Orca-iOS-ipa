name: iOS Step 3 FAST - GUI-only iteration

# Speed-optimized step 3. Assumes ios-step3-gui.yml has run at least once and
# populated the deps cache (ios-deps-v1-*) AND the wx cache (ios-wx-v1-*).
# This workflow restores BOTH from cache and jumps straight to configuring +
# compiling Orca's GUI. No deps top-up, no wx rebuild => ~2-3 min/iteration
# instead of ~30 min. Use this for the libslic3r_gui burn-down; fall back to
# the full ios-step3-gui.yml only when deps/wx themselves need rebuilding.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "ninja target to build"
        required: false
        default: "OrcaSlicer"

permissions:
  contents: write

# Only the newest run per branch is useful: an older one is building code that
# has already been superseded, and while the wx loop iterates it would otherwise
# keep a device build busy for forty minutes on a fix that is already in.
#
# Safe to cancel now in a way it was not before: the deps caches are keyed on
# hashFiles(patches/step1) rather than the run number, and actions/cache skips
# the save when the key already exists -- so a cancelled run part-way through
# its deps step can no longer write the partial entry that cost run 11 twenty
# five minutes.
concurrency:
  group: step3-fast-${{ github.ref }}
  cancel-in-progress: true


jobs:
  gui-fast:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ORCA_REF: "395e070a0e675fd4723f93967cefede730c482d9"
      # 26.0 and the newest Xcode, for the same reason as step4: patch 0381 uses
      # UIGlassEffect unguarded, so an older SDK or deployment target does not
      # compile at all.
      IOS_MIN: "26.0"
      PREFIX: ${{ github.workspace }}/ios-prefix
      WXPREFIX: ${{ github.workspace }}/wx-prefix
      SDK: iphonesimulator
      TARGET: ${{ github.event.inputs.target || 'OrcaSlicer' }}

    steps:
      - name: Select Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "selected $NEWEST, iOS SDK $SDK_VER"
          if [ "${SDK_VER%%.*}" -lt 26 ]; then
            echo "::error::Newest Xcode here has iOS SDK $SDK_VER; Liquid Glass needs 26 or newer."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
      - run: brew install cmake ninja >/dev/null

      - name: Fetch Orca + apply step1+step3 patches + copy shims
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/SoftFever/OrcaSlicer.git orca
          cd orca && git fetch --depth 1 origin "$ORCA_REF" && git checkout "$ORCA_REF"
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/step1/*.patch "$GITHUB_WORKSPACE"/patches/step3/*.patch; do
            git apply --verbose "$p"
          done
          mkdir -p deps_src/hidapi/ios
          cp "$GITHUB_WORKSPACE"/ios/hid_ios_stub.c deps_src/hidapi/ios/hid.c
          # The ES/ shader set upstream has never had. Required for the launch,
          # and harmless for a compile-only run.
          cp -R "$GITHUB_WORKSPACE"/orca-overlay/. .
          test "$(ls resources/shaders/ES | wc -l)" -eq 38
          # The German catalogue rides in on the same overlay copy; upstream's
          # gettext_po_to_mo target is not in `all` and nothing here builds it.
          python3 "$GITHUB_WORKSPACE"/tools/i18n/build-de-catalog.py --check
          test -s resources/i18n/de/OrcaSlicer.mo
          # libslic3r and libslic3r_gui are the only two targets that build a
          # precompiled header, and they are exactly the 563 objects that never
          # hit the ccache: ccache hashes the .pch, and a .pch embeds the size
          # and mtime of every header that went into it. Orca is re-cloned every
          # run, so those mtimes are new every run and the .pch hash is new every
          # run no matter what the sources say. Pin them to a fixed instant and
          # the .pch becomes a function of content again.
          find "$GITHUB_WORKSPACE/orca" -exec touch -h -t 202601010000.00 {} +

      - name: Compute cache keys from patch/overlay hashes
        run: |
          set -euxo pipefail
          WXH=$({ find wx-overlay -type f | LC_ALL=C sort; cat $(find wx-overlay -type f | LC_ALL=C sort) patches/step2/*.patch; } | shasum | cut -c1-12)
          echo "WX_KEY=ios-wxprefix-v5-$WXH" >> "$GITHUB_ENV"
          echo "wx cache key: ios-wxprefix-v5-$WXH"

      - name: Restore deps cache (required)
        uses: actions/cache/restore@v4
        with:
          path: |
            ios-prefix
          key: ios-prefixonly-v1
          restore-keys: |
            ios-prefixonly-v1
            ios-deps-v1-

      - name: Restore wx cache (required)
        uses: actions/cache/restore@v4
        with:
          path: |
            wx-prefix
          key: ${{ env.WX_KEY }}

      - name: Sanity - prefixes present
        run: |
          set -euxo pipefail
          test -d "$PREFIX/usr/local/lib" || { echo "::error::deps prefix missing - run full ios-step3-gui.yml first"; exit 1; }
          test -d "$WXPREFIX" || { echo "::error::wx prefix missing - run full ios-step3-gui.yml first"; exit 1; }
          # ship overlay headers into wx prefix (idempotent)
          WXINC=$(find "$WXPREFIX/include" -maxdepth 1 -name "wx-*" -type d | head -1)
          cp -r "$GITHUB_WORKSPACE"/wx-overlay/include/wx "$WXINC/" 2>/dev/null || true
          # Same reason as the orca tree: the precompiled header consumes wx and
          # the deps headers too, and this copy hands the overlay ones a fresh
          # mtime every run. A cache restore preserves mtimes, so pinning these
          # is belt and braces - but the copy above is not, and it is in the PCH.
          find "$WXPREFIX" "$PREFIX" -exec touch -h -t 202601010000.00 {} + 2>/dev/null || true

      - name: Set up ccache
        run: |
          brew install ccache || true
          ccache --version | head -1
          echo "CCACHE_DIR=$HOME/.ccache-step3" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          # Cheap compression: the runner has 3 cores and they are all wanted
          # for compiling, not for zstd.
          echo "CCACHE_COMPRESSLEVEL=1" >> "$GITHUB_ENV"
          # 650 Orca translation units do not fit in 1.5G, and an undersized
          # cache evicts the objects it is about to be asked for again.
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          # The build tree path is stable on the runner, but BASEDIR rewrites
          # absolute paths anyway and NOHASHDIR keeps the object's own directory
          # out of the hash - both are what make a hit survive across runs.
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"
          # iOS cross-compiles embed the SDK path; slop keeps cache hits across
          # runner image updates that only move the SDK. system_headers stops
          # the whole SDK being hashed into every single object.
                    # NOTE: no `system_headers`. It was here as a speed measure - "so the
          # SDK does not get hashed into every object" - and it silently turned
          # off cache invalidation for OrcaSlicer's OWN headers. Orca's root
          # CMakeLists.txt does:
          #
          #     set(LIBDIR ${CMAKE_CURRENT_SOURCE_DIR}/src)
          #     include_directories(SYSTEM ${LIBDIR})
          #
          # so `#include "slic3r/GUI/GUI_App.hpp"` resolves through -isystem and
          # every project header IS a system header as far as ccache is
          # concerned. With this sloppiness set, editing a header changed
          # nothing about any cache key: only translation units whose own .cpp
          # changed were recompiled, and everything else was served from cache
          # still compiled against the OLD header. Mixed layouts in one binary.
          #
          # That is not theoretical. Adding one member to GUI_App shifted
          # app_config's offset, PresetUpdater.cpp.o came back from the cache
          # with the old offset, and the app SIGSEGVd at launch inside
          # AppConfig::version_check_url - three device round trips away from
          # the change that caused it. Hashing the SDK is the cheaper problem.
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime,locale" >> "$GITHUB_ENV"
          # Run 6 hit only 76 of 639, and 563 of those misses failed the
          # preprocessed lookup too - meaning the preprocessed output itself
          # differs between runs. Rather than keep guessing at which input is
          # volatile, have ccache write down its own reason for a few objects.
          echo "CCACHE_DEBUG=1" >> "$GITHUB_ENV"
          echo "CCACHE_DEBUGDIR=/tmp/ccache-debug" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache-step3
          key: ccache-step3-v2-${{ github.run_id }}
          restore-keys: |
            ccache-step3-v2-

      - name: Configure Orca GUI
        run: |
          set -euxo pipefail
          cd orca && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$SDK \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DSLIC3R_GUI=1 -DSLIC3R_OPENGL_ES=1 -DSLIC3R_STATIC=1 \
            -DCMAKE_PREFIX_PATH="$PREFIX/usr/local;$WXPREFIX" \
            -DCMAKE_FIND_ROOT_PATH="$PREFIX/usr/local;$WXPREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DJPEG_LIBRARY="$PREFIX/usr/local/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$PREFIX/usr/local/include" \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /tmp/fast-configure.log
          # configure_file writes libslic3r_version.h and the pch header itself
          # with the current time. Both are inputs to the .pch, so pin them too -
          # but only the generated *headers*, not the whole build tree: giving
          # build.ninja an mtime older than the CMakeLists it came from would
          # have ninja re-run cmake and undo this on the spot.
          find . \( -name "*.h" -o -name "*.hxx" -o -name "*.hpp" \) -type f \
            -exec touch -h -t 202601010000.00 {} +

      - name: Build target
        run: |
          set -euxo pipefail
          cd orca/build
          ccache -z >/dev/null 2>&1 || true
          ninja -k 0 "$TARGET" 2>&1 | tee /tmp/fast-ninja.log
          # Nobody has ever looked at whether ccache is earning its keep here;
          # the hit rate is the difference between a 50-minute round trip and a
          # 5-minute one, so make it visible in ci-logs every run.
          { ccache -s -v 2>/dev/null || ccache -s; } | tee /tmp/ccache-stats.txt
          # Run 6 hit 76 of 639, and the 76 line up with the targets that do not
          # use a precompiled header: deps_src, imgui, libvgcode. libslic3r and
          # libslic3r_gui both build a cmake_pch.hxx.pch, every one of their
          # objects is compiled with -include-pch, and ccache hashes that file's
          # content. A .pch embeds the size and mtime of every header it consumed
          # - and Orca is re-cloned every run, so those mtimes are new every run.
          # If that is the story, these digests differ from run to run while the
          # sources do not. Compare them across two runs before changing anything.
          find . -name "cmake_pch.hxx*" -type f -exec shasum -a 256 {} + \
            | sed "s#\./##" | sort -k2 | tee /tmp/pch-fingerprint.txt
          find . -name "cmake_pch.hxx*" -type f -exec stat -f "%m %z %N" {} + \
            | sort -k3 | tee -a /tmp/pch-fingerprint.txt

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache-step3
          key: ccache-step3-v2-${{ github.run_id }}


      # The binary, on its own, so the launch loop does not need the compile.
      # ios-relaunch.yml downloads the newest one of these and re-tests it in
      # four minutes instead of fifty-five.
      - name: Upload the linked binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orca-binary
          path: orca/build/src/OrcaSlicer.app/OrcaSlicer
          if-no-files-found: warn
          retention-days: 7

      - name: Launch in iPad simulator + screenshot
        if: success()
        run: |
          set -uxo pipefail
          BIN=orca/build/src/OrcaSlicer.app/OrcaSlicer
          [ -f "$BIN" ] || { echo "no linked executable (target was $TARGET) - nothing to launch"; exit 0; }
          mkdir -p artifact
          bash "$GITHUB_WORKSPACE/tools/ci/assemble-sim-bundle.sh" \
            "$BIN" orca/resources "$PWD/sim/OrcaSlicer.app" "$IOS_MIN" \
            2>&1 | tee /tmp/bundle-check.log
          bash "$GITHUB_WORKSPACE/tools/ci/sim-launch-verify.sh" \
            "$PWD/sim/OrcaSlicer.app" org.orca-ios.orcaslicer "$PWD/artifact"


      - name: Upload launch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-ios-fast-launch
          path: artifact/
          if-no-files-found: ignore

      # always(), not failure(): once the link is green the interesting failure
      # is a runtime one, and a crashed app still leaves the job green.
      - name: Publish logs
        if: always()
        run: |
          set -ux
          D="ci-logs/fast-run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$D"
          [ -f /tmp/fast-configure.log ] && tail -c 40000 /tmp/fast-configure.log > "$D/configure.log"
          # A couple of ccache debug logs are enough to name the volatile input,
          # but only if they are logs of a MISS: run 7 published the first three
          # files in the directory and all three were hits from deps_src, which
          # says nothing about why the other 563 missed. Select on the outcome.
          if [ -d /tmp/ccache-debug ]; then
            grep -rl "Result: cache_miss" /tmp/ccache-debug --include="*.ccache-log" \
              | grep -E "libslic3r|slic3r" | head -3 | while read -r f; do
              cp "$f" "$D/ccache-miss-$(basename "$f")" 2>/dev/null || true
            done
            grep -rl "Result: direct_cache_hit" /tmp/ccache-debug --include="*.ccache-log" \
              | head -1 | while read -r f; do
              cp "$f" "$D/ccache-hit-$(basename "$f")" 2>/dev/null || true
            done
          fi
          for l in /tmp/bundle-check.log /tmp/ccache-stats.txt /tmp/pch-fingerprint.txt \
                   artifact/sim-launch.log artifact/sim-install.log \
                   artifact/launch-verdict.txt artifact/screenshot-stats.txt \
                   artifact/orca-app-log.txt; do
            [ -f "$l" ] && tail -c 20000 "$l" > "$D/$(basename "$l")"
          done
          # Every screenshot, not just the last: the sequence is the evidence
          # that the UI came up rather than flashed and went away.
          cp artifact/*.png "$D/" 2>/dev/null || true
          [ -f artifact/sim-oslog.txt ] && tail -c 60000 artifact/sim-oslog.txt > "$D/sim-oslog.txt"
          find "$HOME/Library/Logs/DiagnosticReports" -name "OrcaSlicer*" -exec cp {} "$D/" \; 2>/dev/null || true
          [ -f /tmp/fast-ninja.log ] && grep -n -B3 -A35 -E "FAILED:|error:|Error [0-9]" /tmp/fast-ninja.log | head -c 400000 > "$D/errors.log"
          # -k0 summary: full map of remaining errors
          if [ -f /tmp/fast-ninja.log ]; then
            {
              echo "=== FAILED files ==="
              grep "FAILED:" /tmp/fast-ninja.log | sed -E "s#.*CMakeFiles/[^/]+\\.dir/##; s#\\.o.*##" | sort -u
              echo; echo "=== error signatures (deduped) ==="
              grep -oE "(unknown type name '[^']+'|use of undeclared identifier '[^']+'|unknown class name '[^']+'|no member named '[^']+'|no type named '[^']+'|no matching [a-z ]+ for call to '[^']+'|'[A-Za-z0-9_/.]+' file not found|marked 'override' but does not override|only virtual member functions can be marked 'override'|base class has incomplete type|cannot initialize [a-z ]+ (parameter|object))" /tmp/fast-ninja.log | sort | uniq -c | sort -rn
              echo; echo "total FAILED: $(grep -c FAILED: /tmp/fast-ninja.log)"
            } > "$D/SUMMARY.txt"
          fi
          git config user.name "ci-bot" && git config user.email "ci@users.noreply.github.com"
          git add -A ci-logs || true
          git commit -m "fast ci logs run ${GITHUB_RUN_NUMBER}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
