name: iOS Step 4 - OrcaSlicer device IPA

# The device (iphoneos) counterpart of step 3, ending in a sideloadable
# unsigned .ipa of the real OrcaSlicer.
#
# Same build as step 3 with SDK=iphoneos, so the whole dependency stack has to
# be built again for the device slice — the step-1 patches already branch on
# simulator vs device (OpenSSL ios64-xcrun, GMP/MPFR -miphoneos-version-min),
# so this is a long build rather than a new porting problem. It is started
# early and in parallel with the step-3 link iteration precisely because those
# deps are the multi-hour long pole; every run warms the device deps cache
# even when the link stage still fails.

# Dispatch only. This used to build on every push touching patches/**,
# wx-overlay/** or this file, which combined with cancel-in-progress below meant
# any commit killed the device build that was already running - including
# commits that only changed something unrelated to it. A 70-minute build is too
# expensive to start by accident and far too expensive to cancel by accident.
on:
  workflow_dispatch:
    inputs:
      orca_ref:
        required: false
        default: "395e070a0e675fd4723f93967cefede730c482d9"
      wx_ref:
        required: false
        default: "v3.3.2"
      ios_min:
        required: false
        default: "17.0"

permissions:
  contents: write

# Only the newest run per branch is useful: an older one is building code that
# has already been superseded, and while the wx loop iterates it would otherwise
# keep a device build busy for forty minutes on a fix that is already in.
#
# Safe to cancel now in a way it was not before: the deps caches are keyed on
# hashFiles(patches/step1) rather than the run number, and actions/cache skips
# the save when the key already exists -- so a cancelled run part-way through
# its deps step can no longer write the partial entry that cost run 11 twenty
# five minutes.
concurrency:
  group: step4-device-${{ github.ref }}
  cancel-in-progress: true


jobs:
  device:
    name: OrcaSlicer for iPad (device)
    runs-on: macos-15
    timeout-minutes: 360

    env:
      ORCA_REF: ${{ github.event.inputs.orca_ref || '395e070a0e675fd4723f93967cefede730c482d9' }}
      WX_REF: ${{ github.event.inputs.wx_ref || 'v3.3.2' }}
      IOS_MIN: ${{ github.event.inputs.ios_min || '17.0' }}
      PREFIX: ${{ github.workspace }}/ios-prefix
      WXPREFIX: ${{ github.workspace }}/wx-prefix
      SDK: iphoneos

    steps:
      - name: "[1/9] Checkout + tools"
        uses: actions/checkout@v4
      - run: |
          set -euxo pipefail
          brew install cmake ninja automake autoconf libtool nasm texinfo
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"

      - name: Compute cache keys from patch/overlay hashes
        run: |
          set -euxo pipefail
          WXH=$({ find wx-overlay -type f | LC_ALL=C sort; cat $(find wx-overlay -type f | LC_ALL=C sort) patches/step2/*.patch; } | shasum | cut -c1-12)
          echo "WX_KEY=ios-wxprefix-device-v4-$WXH" >> "$GITHUB_ENV"

      - name: "[2/9] Fetch Orca + apply step1+step3 patches"
        run: |
          set -euxo pipefail
          git clone https://github.com/SoftFever/OrcaSlicer.git orca
          cd orca && git checkout "$ORCA_REF"
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/step1/*.patch "$GITHUB_WORKSPACE"/patches/step3/*.patch; do
            git apply --verbose "$p"
          done
          mkdir -p deps_src/hidapi/ios
          cp "$GITHUB_WORKSPACE"/ios/hid_ios_stub.c deps_src/hidapi/ios/hid.c
          # Orca ships resources/shaders/{110,140} only; the SLIC3R_OPENGL_ES
          # path asks for an "ES/" set that upstream has never had, so supply it.
          cp -R "$GITHUB_WORKSPACE"/orca-overlay/. .
          test "$(ls resources/shaders/ES | wc -l)" -eq 38

      - name: "[3/9] Restore device deps cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            orca/deps/build
            ios-prefix
            ~/dep-dl
          # Keyed on what changes the dependency build, not on the run number:
          # a per-run key mints a new multi-GB entry every time, and against a
          # 10 GB repository quota that evicts the entry the next run needs.
          # See the matching change in ios-step3-gui.yml.
          key: ios-deps-device-v1-${{ hashFiles('patches/step1/*.patch') }}
          restore-keys: |
            ios-deps-device-v1-

      - name: "[4/9] Build deps for the device slice"
        id: depsbuild
        run: |
          set -euxo pipefail
          cd orca/deps
          if [ -d build ]; then
            for d in build/dep_*-prefix; do
              [ -d "$d" ] || continue
              ls "$d"/src/*-stamp/*-install >/dev/null 2>&1 || rm -rf "$d"
            done
          fi
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$SDK \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 -DORCA_DEPS_GUI=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON \
            -DDESTDIR="$PREFIX" -DDEP_DOWNLOAD_DIR="$HOME/dep-dl" > /dev/null
          WANT="dep_ZLIB dep_PNG dep_EXPAT dep_FREETYPE dep_Boost dep_TBB \
                dep_OpenSSL dep_CURL dep_Cereal dep_Eigen dep_NLopt dep_Qhull \
                dep_JPEG dep_GMP dep_MPFR dep_CGAL dep_Blosc dep_OpenEXR dep_OpenVDB \
                dep_Draco dep_libnoise dep_OCCT dep_OpenCV"
          ninja -t targets all > /tmp/t.txt
          B=""; for t in $WANT; do grep -q "^${t}:" /tmp/t.txt && B="$B $t" || true; done
          ninja $B 2>&1 | tee /tmp/deps-ninja.log

      - name: Save device deps cache
        # See the wx prefix save. The deps step does repair itself - it deletes
        # any dep_*-prefix without an install stamp before building - and its key
        # is stable, so a partial entry is less dangerous here. Still not worth
        # writing one.
        if: |
          always() &&
          (steps.depsbuild.outcome == 'success' || steps.depsbuild.outcome == 'skipped')
        uses: actions/cache/save@v4
        with:
          path: |
            orca/deps/build
            ios-prefix
            ~/dep-dl
          # Same key as the restore: an existing key makes the save a skip.
          key: ios-deps-device-v1-${{ hashFiles('patches/step1/*.patch') }}

      # Both workflows have been SAVING this prefix and never restoring it,
      # so wx was rebuilt from scratch on every single run - 5-6 minutes each
      # time, for a tree that only changes when patches/step2 or wx-overlay
      # do. WX_KEY already hashes exactly those, so a hit is always correct.
      #
      # It may also matter for ccache: every Orca GUI file includes wx
      # headers, and a restored prefix is byte-identical across runs where a
      # rebuilt one only ought to be.
      - name: Restore wx prefix cache
        id: wxcache
        uses: actions/cache/restore@v4
        with:
          path: wx-prefix
          key: ${{ env.WX_KEY }}

      - name: "[5/9] Build wxWidgets iPhone port (device)"
        id: wxbuild
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/SoftFever/Orca-deps-wxWidgets.git wx
          cd wx && git checkout "$WX_REF" && git submodule update --init --recursive
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/step2/*.patch; do git apply --verbose "$p"; done
          cp -r "$GITHUB_WORKSPACE"/wx-overlay/include/. include/
          cp -r "$GITHUB_WORKSPACE"/wx-overlay/src/. src/
          mkdir -p build-ios && cd build-ios
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$SDK \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
            -DIPHONE=ON -DwxBUILD_TOOLKIT=osx_iphone \
            -DCMAKE_BUILD_TYPE=Release \
            -DwxBUILD_DEBUG_LEVEL=0 \
            -DwxBUILD_SHARED=OFF -DwxBUILD_PRECOMP=OFF -DwxBUILD_SAMPLES=OFF \
            -DwxUSE_OPENGL=ON -DwxUSE_WEBVIEW=ON -DwxUSE_XRC=OFF \
            -DwxUSE_MEDIACTRL=OFF -DwxUSE_SECRETSTORE=OFF \
            -DwxUSE_GRID=ON -DwxUSE_LISTCTRL=ON -DwxUSE_IMAGLIST=ON \
            -DwxUSE_AUI=ON -DwxUSE_COMBOBOX=ON \
            -DwxUSE_DATAOBJ=ON -DwxUSE_DRAG_AND_DROP=ON \
            -DwxUSE_CLIPBOARD=ON -DwxUSE_TOOLTIPS=ON \
            -DwxUSE_NANOSVG=OFF \
            -DwxUSE_LOGWINDOW=ON \
            -DwxUSE_LIBJPEG=sys \
            -DJPEG_LIBRARY="$PREFIX/usr/local/lib/libjpeg.a" \
            -DJPEG_LIBRARY_RELEASE="$PREFIX/usr/local/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$PREFIX/usr/local/include" \
            -DCMAKE_INSTALL_PREFIX="$WXPREFIX" > /dev/null
          ninja -k 0 > /tmp/wx-ninja.log 2>&1 || (tail -120 /tmp/wx-ninja.log && exit 1)
          ninja install > /tmp/wx-install.log 2>&1 || { tail -80 /tmp/wx-install.log; exit 1; }
          # NB the JPEG_* values are pinned outright rather than found through
          # CMAKE_PREFIX_PATH / CMAKE_FIND_ROOT_PATH_MODE_*=BOTH: opening those
          # up lets Homebrew's macOS libjpeg into an iOS link, which is a trap
          # this repo already fell into once (see the deps notes in HANDOFF.md).
          # FindJPEG honours preset cache entries, and JPEG_LIBRARY_RELEASE is
          # set too because select_library_configurations derives JPEG_LIBRARY
          # from it in newer CMake.
          #
          # wx defaults its third-party libs to "builtin" on Apple, which builds
          # libwxjpeg-3.3.a alongside the libjpeg.a the dependency stack already
          # provides. Both end up on the OrcaSlicer link line, ld pulls
          # jcomapi.c.o out of each, and the four jpeg_* symbols they share are
          # duplicate-symbol errors (step-4 run 11). Point wx at the one libjpeg
          # instead. build/cmake/lib/jpeg.cmake silently forces itself back to
          # "builtin" when find_package(JPEG) misses, so assert rather than
          # discover it 40 minutes later at the link.
          test ! -f "$WXPREFIX/lib/libwxjpeg-3.3.a" || {
            echo "wx fell back to its builtin libjpeg -- JPEG_LIBRARY/JPEG_INCLUDE_DIR did not take"
            exit 1
          }
          WXINC=$(find "$WXPREFIX/include" -maxdepth 1 -name "wx-*" -type d | head -1)
          [ -n "$WXINC" ] || WXINC="$WXPREFIX/include"
          cp -r "$GITHUB_WORKSPACE"/wx-overlay/include/wx "$WXINC/" 2>/dev/null || true
          mkdir -p "$WXINC/wx/generic/private"
          cp -R "$GITHUB_WORKSPACE"/wx/include/wx/generic/private/. "$WXINC/wx/generic/private/"
          cp "$GITHUB_WORKSPACE"/wx/include/wx/webview.h "$GITHUB_WORKSPACE"/wx/include/wx/webviewarchivehandler.h "$GITHUB_WORKSPACE"/wx/include/wx/webviewfshandler.h "$WXINC/wx/"
          mkdir -p "$WXINC/wx/osx"
          cp "$GITHUB_WORKSPACE"/wx/include/wx/osx/webviewhistoryitem_webkit.h "$WXINC/wx/osx/"
          mkdir -p "$WXINC/wx/private"
          cp -R "$GITHUB_WORKSPACE"/wx/include/wx/private/. "$WXINC/wx/private/"

      - name: Save wx device prefix cache
        # Only when the build ran to completion, or was skipped because the
        # cache already had it.
        #
        # `if: always()` runs on cancellation, and the concurrency group cancels
        # the previous run every time a new one is dispatched. Run 115 was killed
        # 0.9 min into [5/9] and saved a wx-prefix containing almost nothing
        # under a brand new WX_KEY - wx installs its headers and libraries at the
        # END of its build, so a prefix captured part way through is empty. The
        # next run restores that, skips [5/9] entirely, and links against a
        # prefix with no libraries in it. Same trap as the ccache save; this is
        # the one that had not been shut.
        if: |
          always() &&
          (steps.wxbuild.outcome == 'success' || steps.wxbuild.outcome == 'skipped')
        uses: actions/cache/save@v4
        with:
          path: wx-prefix
          key: ${{ env.WX_KEY }}

      - name: Set up ccache
        run: |
          brew install ccache || true
          echo "CCACHE_DIR=$HOME/.ccache-step4" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1.5G" >> "$GITHUB_ENV"
                    # NOTE: no `system_headers`. It was here as a speed measure - "so the
          # SDK does not get hashed into every object" - and it silently turned
          # off cache invalidation for OrcaSlicer's OWN headers. Orca's root
          # CMakeLists.txt does:
          #
          #     set(LIBDIR ${CMAKE_CURRENT_SOURCE_DIR}/src)
          #     include_directories(SYSTEM ${LIBDIR})
          #
          # so `#include "slic3r/GUI/GUI_App.hpp"` resolves through -isystem and
          # every project header IS a system header as far as ccache is
          # concerned. With this sloppiness set, editing a header changed
          # nothing about any cache key: only translation units whose own .cpp
          # changed were recompiled, and everything else was served from cache
          # still compiled against the OLD header. Mixed layouts in one binary.
          #
          # That is not theoretical. Adding one member to GUI_App shifted
          # app_config's offset, PresetUpdater.cpp.o came back from the cache
          # with the old offset, and the app SIGSEGVd at launch inside
          # AppConfig::version_check_url - three device round trips away from
          # the change that caused it. Hashing the SDK is the cheaper problem.
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime,locale" >> "$GITHUB_ENV"
          # An 11.9% hit rate means a one-file change still recompiles 563 of
          # 639 objects, which is the whole reason an iteration costs an hour.
          # The cache is only a quarter full, so it is not eviction. Log the
          # per-object miss reason so the next run names the cause instead of
          # another guess.
          echo "CCACHE_LOGFILE=$HOME/ccache-step4.log" >> "$GITHUB_ENV"
          # Absolute paths inside the workspace should not defeat hashing.
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache-step4
          key: ccache-step4-v2-${{ github.run_id }}
          restore-keys: |
            ccache-step4-v2-

      # What the restore actually found, recorded before anything compiles.
      #
      # Step durations are the only thing readable from outside this runner in
      # the environment these builds are driven from - job log downloads and the
      # cache API are both blocked - and they cannot tell a hit from a miss: a
      # populated ccache restores in about six seconds and an absent one in
      # zero, which round to 0.1 and 0.0 minutes. That ambiguity has now cost
      # two rounds of guessing. cache-matched-key names the entry, or is empty
      # when there was none, and the size says whether what came back has
      # anything in it.
      - name: "ccache restore report"
        if: always()
        run: |
          set +e
          {
            echo "cache-hit:         ${{ steps.ccache_restore.outputs.cache-hit }}"
            echo "cache-matched-key: ${{ steps.ccache_restore.outputs.cache-matched-key }}"
            echo "dir:               $HOME/.ccache-step4"
            du -sh "$HOME/.ccache-step4" 2>/dev/null || echo "  (no directory)"
            echo "files:             $(find "$HOME/.ccache-step4" -type f 2>/dev/null | wc -l)"
            echo "=== ccache -s before the build ==="
            ccache -s 2>/dev/null
          } | tee /tmp/ccache-restore.txt

      - name: "[6/9] Configure Orca GUI build (device)"
        run: |
          set -euxo pipefail
          cd orca && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$SDK \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DSLIC3R_GUI=1 -DSLIC3R_OPENGL_ES=1 -DSLIC3R_STATIC=1 \
            -DSLIC3R_PCH=0 -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DCMAKE_PREFIX_PATH="$PREFIX/usr/local;$WXPREFIX" \
            -DCMAKE_FIND_ROOT_PATH="$PREFIX/usr/local;$WXPREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DJPEG_LIBRARY="$PREFIX/usr/local/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$PREFIX/usr/local/include" \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /tmp/step4-configure.log

      # Precompiled headers off, on purpose, to make ccache work.
      #
      # Run 73: 75 direct_cache_hit against 563 direct_cache_miss, with 710
      # local_storage_read_hit - so the cache was restored and the manifests
      # were found, and then rejected because a recorded input hashed
      # differently. Sloppiness already covers time_macros, pch_defines and
      # header mtimes, and CCACHE_BASEDIR covers absolute paths, which leaves
      # the PCH: ccache hashes cmake_pch.hxx.pch as an input, the build tree is
      # created fresh every run so the .pch is rebuilt every run, and a clang
      # PCH serialises the paths and mtimes of a source tree that was cloned
      # minutes earlier. Different bytes, different hash, every dependent TU
      # misses. pch_defines governs how a PCH may be used, not whether its
      # content is hashed.
      #
      # SLIC3R_PCH=0 is Orca's own option (guarding add_precompiled_header in
      # src/libslic3r/CMakeLists.txt); CMAKE_DISABLE_PRECOMPILE_HEADERS is the
      # backstop for anything calling target_precompile_headers directly.
      #
      # Expect NO speedup on the first run after this change - dropping
      # -include-pch changes every compile command line, so every manifest is
      # new and the whole tree is a miss. The payoff is the run after that.
      # If the hit rate does not move, put the PCH back: a genuinely cold TU
      # is slower without it.
      - name: "[7/9] Build + link OrcaSlicer (device)"
        id: orcabuild
        run: |
          set -euxo pipefail
          cd orca/build
          ninja -k 0 libslic3r_gui 2>&1 | tee /tmp/step4-ninja.log
          ninja -k 0 OrcaSlicer 2>&1 | tee -a /tmp/step4-ninja.log

      # ccache is the difference between a five-minute iteration and an
      # hour, so its numbers must be visible on a SUCCESSFUL run - the
      # ci-logs publisher below is if: failure(), which is exactly why
      # run 37 produced no report at all. Straight to the job log.
      - name: "ccache report"
        if: always()
        run: |
          set +e
          echo "=== ccache -s ==="
          ccache -s
          LOG="$HOME/ccache-step4.log"
          if [ -f "$LOG" ]; then
            echo "=== miss reasons, ranked ==="
            grep -oE "Result: .*" "$LOG" | sort | uniq -c | sort -rn | head -20
            # -B8 only ever caught ccache's stats-lock bookkeeping, which is
            # why run 73's report could not say WHY 563 objects missed. The
            # reason lines ccache emits are much further up each unit's
            # section, so rank them directly and then print one whole unit.
            echo "=== reasons, ranked ==="
            grep -oE "(Include file .* has changed|.*not found in manifest.*|No object file hash in manifest|Got object file hash from manifest|Failed to .*|Disabling direct mode.*|.* is a precompiled header.*|.*pch.*)" "$LOG" \
              | sed -E "s#/Users/runner[^ ]*/##" | sort | uniq -c | sort -rn | head -25
            echo "=== one missing unit, whole section ==="
            grep -B60 -m1 "Result: cache_miss" "$LOG" | tail -60
            # ccache keys the manifest on the command line, so a flag added to
            # the Orca build - which is what -DwxBUILD_DEBUG_LEVEL=0 did in run
            # 70 - misses every single object exactly once and looks identical
            # to a broken cache. Print the line so the next run can diff it.
            echo "=== first compile command line ==="
            grep -m1 -A1 "Command line:" "$LOG"
          else
            echo "no ccache log at $LOG"
          fi

      - name: Save ccache
        # Only when the build actually ran.
        #
        # The concurrency group cancels the previous run every time a new one is
        # dispatched, and `if: always()` runs on cancellation too - so a run
        # killed during the deps step, which never compiles a line, still saved
        # an EMPTY ccache under a brand new key. Restore matches on the prefix
        # `ccache-step4-v2-` and takes the most recent entry, so that empty one
        # then outranks every good cache on the branch and the next run compiles
        # all 639 objects cold. Run 107 was cancelled 21 minutes into the deps
        # step and its Save ccache reported success in 0.0 minutes; that is the
        # shape of the bug.
        #
        # `!= 'skipped'` rather than `== 'success'` on purpose: a build that
        # failed or was cancelled part way through still has real objects in the
        # cache and they are worth keeping.
        if: always() && steps.orcabuild.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache-step4
          key: ccache-step4-v2-${{ github.run_id }}

      - name: "[8/9] Assemble unsigned OrcaSlicer.ipa"
        run: |
          set -euxo pipefail
          # The link rule writes src/OrcaSlicer.app/OrcaSlicer; fall back to a
          # Mach-O scan because the executable's name has moved around upstream
          # (OrcaSlicer vs orca-slicer).
          BIN=""
          [ -f orca/build/src/OrcaSlicer.app/OrcaSlicer ] && BIN=orca/build/src/OrcaSlicer.app/OrcaSlicer
          if [ -z "$BIN" ]; then
            while IFS= read -r f; do
              file "$f" | grep -q "Mach-O 64-bit executable" && { BIN="$f"; break; }
            done < <(find orca/build/src -maxdepth 2 -type f -perm -111 | sort)
          fi
          [ -n "$BIN" ] || { echo "no Mach-O executable found under orca/build/src"; \
                             find orca/build/src -maxdepth 2 -type f -perm -111 | head -40; exit 1; }
          echo "executable: $BIN"
          vtool -show-build "$BIN" | grep -qE "platform[[:space:]]+(IOS|2)[[:space:]]*$"

          # Did wx's UIApplication delegate actually make it into the binary?
          # Patch 0318 forces it in with -u through a clang response file (a
          # plain link flag loses the '$' to Ninja's own variable expansion, and
          # ld then fails on a bare "_OBJC_CLASS_" - that is how run 25 died).
          # Without the class the IPA still builds and then exits at launch with
          # a nil delegate, so report it here. Not fatal: nm on this binary has
          # given a wrong answer before (see HANDOFF), so a miss is a warning to
          # go and check, not a reason to throw away a build.
          if nm -a "$BIN" 2>/dev/null | grep -q '_OBJC_CLASS_\$_wxAppDelegate'; then
            echo "wxAppDelegate: present (nm)"
          elif otool -ov "$BIN" 2>/dev/null | grep -q 'wxAppDelegate'; then
            echo "wxAppDelegate: present (otool -ov)"
          else
            echo "::warning::_OBJC_CLASS_\$_wxAppDelegate not found in $BIN - the app would launch with a nil delegate and exit"
          fi

          APP=stage/Payload/OrcaSlicer.app
          rm -rf stage && mkdir -p "$APP"
          cp "$BIN" "$APP/OrcaSlicer"
          # Orca reads profiles/shaders/icons out of resources/ at runtime.
          cp -R orca/resources "$APP/orca-resources"
          # A top-level "resources" directory is "Resources" on a case-insensitive
          # filesystem, and CFBundle then reads the flat bundle as an old-style
          # one whose Info.plist lives inside it - the installer reports the
          # useless "Missing bundle ID". Proved by ios-sim-probe.yml round 3.
          if [ -e "$APP/resources" ] || [ -e "$APP/Resources" ]; then
            echo "::error::$APP has a top-level resources directory; installers will reject it"
            exit 1
          fi
          # SDK build metadata. Every Xcode-built app carries these, and this
          # plist is written by hand, so it never had them - it has
          # DTPlatformName and nothing else.
          #
          # They are not decoration. iOS reads DTPlatformVersion and DTSDKName
          # to decide which SDK an app was built against, and an app it cannot
          # place gets treated as an old one: rendered on a compatibility canvas
          # and downsampled to the panel. That is exactly what this build has
          # been doing - UIScreen reports 1600x1200 at scale 2 on a display
          # whose native size is 2064x2752, a ratio of 1.72 in both directions.
          #
          # Three Info.plist candidates have been tried against that already
          # (UIApplicationSceneManifest, dropping UIRequiresFullScreen, and both
          # together) and none moved it. This is the remaining difference
          # between this bundle and one Xcode would have produced.
          SDK_VERSION=$(xcrun --sdk "$SDK" --show-sdk-version)
          SDK_BUILD=$(xcrun --sdk "$SDK" --show-sdk-build-version)
          XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')
          # DTXcode is the version without dots, zero padded to four: 16.2 -> 1620.
          XCODE_VER=$(xcodebuild -version | awk 'NR==1 {print $2}')
          DTXCODE=$(printf '%02d%02d' "${XCODE_VER%%.*}" "$(echo "$XCODE_VER" | cut -d. -f2)")
          echo "SDK $SDK_VERSION ($SDK_BUILD), Xcode $XCODE_VER ($XCODE_BUILD) -> DTXcode $DTXCODE"

          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>OrcaSlicer</string>
            <key>CFBundleIdentifier</key><string>org.orca-ios.orcaslicer</string>
            <key>CFBundleName</key><string>OrcaSlicer</string>
            <key>CFBundleDisplayName</key><string>OrcaSlicer</string>
            <!-- The CI run number, so a build can identify itself.
                 These were hardcoded 1 / 1.0, which meant nothing in the app,
                 the log or a crash report ever said WHICH build it was. That
                 cost a full round: a crash report arrived from run 112 while
                 run 113 - the build with the fix - was still compiling, and
                 there was no way to tell from the report itself. The .ips
                 prints CFBundleVersion verbatim, and SideStore shows it, so
                 this is the cheapest possible identification. -->
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleShortVersionString</key><string>1.0.${GITHUB_RUN_NUMBER}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleSignature</key><string>????</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>DTPlatformName</key><string>iphoneos</string>
            <key>DTPlatformVersion</key><string>${SDK_VERSION}</string>
            <key>DTPlatformBuild</key><string>${SDK_BUILD}</string>
            <key>DTSDKName</key><string>iphoneos${SDK_VERSION}</string>
            <key>DTSDKBuild</key><string>${SDK_BUILD}</string>
            <key>DTXcode</key><string>${DTXCODE}</string>
            <key>DTXcodeBuild</key><string>${XCODE_BUILD}</string>
            <key>DTCompiler</key><string>com.apple.compilers.llvm.clang.1_0</string>
            <key>MinimumOSVersion</key><string>${IOS_MIN}</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <!-- Force light appearance. Orca draws its own panels in hardcoded
                 white and picks text colours from StateColor, which follows the
                 system appearance - wx reads it from UIScreen's
                 traitCollection. So when the iPad flipped to dark mode after
                 sunset, every custom-drawn label went light-on-white and the
                 "Printer", "Filament" and "Process" headers became invisible,
                 while the native wxStaticText labels stayed dark. The daytime
                 screenshots show them dark and the evening ones white, which is
                 the whole tell. Orca has no dark theme to switch to here. -->
            <key>UIUserInterfaceStyle</key><string>Light</string>
            <!-- iOS 14+ blocks every local-network connection until the user
                 agrees. Without this key the native Bambu LAN backend cannot reach
                 the printer at all, and the failure is silent. -->
            <key>NSLocalNetworkUsageDescription</key>
            <string>OrcaSlicer talks to 3D printers on your local network.</string>
            <key>NSBonjourServices</key><array><string>_bambulab._tcp</string></array>
            <key>NSAppTransportSecurity</key><dict>
              <key>NSAllowsLocalNetworking</key><true/>
            </dict>
            <key>UIRequiresFullScreen</key><true/>
            <!-- Genuinely full screen. UIRequiresFullScreen alone only stops
                 Split View and Slide Over; the status bar still takes a strip
                 off the top and wx's CreateContentView lays the root view out
                 inside -applicationFrame, which excludes it. Hiding the status
                 bar gives that strip back and makes applicationFrame the whole
                 display. UIViewControllerBasedStatusBarAppearance must be false
                 or UIKit asks the view controller instead and ignores the key
                 above - wx's controller does not override it, so the default
                 (visible) would win. -->
            <key>UIStatusBarHidden</key><true/>
            <key>UIViewControllerBasedStatusBarAppearance</key><false/>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <!-- Deep links. MakerWorld's "Open in Bambu Studio" button navigates
                 to bambustudio://open?file=<3mf url>&amp;name=<name>, and older
                 pages use bambustudioopen://<url>; Orca's Downloader accepts
                 both already, along with its own orcaslicer:// and the
                 prusaslicer:// and cura:// aliases. Without CFBundleURLTypes iOS
                 does not know this app claims those schemes, and Safari reports
                 the address as invalid rather than launching anything. There is
                 no Bambu Studio on iPadOS to compete for the scheme.
                 Delivery of the URL is wx patch 0225; what happens next is
                 Orca patch 0377. -->
            <key>CFBundleURLTypes</key><array>
              <dict>
                <key>CFBundleURLName</key><string>org.orca-ios.orcaslicer.open</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>CFBundleURLSchemes</key><array>
                  <string>orcaslicer</string>
                  <string>bambustudio</string>
                  <string>bambustudioopen</string>
                  <string>prusaslicer</string>
                  <string>cura</string>
                </array>
              </dict>
            </array>
            <key>UISupportedInterfaceOrientations</key><array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
          </dict></plist>
          PLIST
          # The app icon. Orca ships no iOS icon, and an iOS icon cannot just be
          # one of its PNGs: OrcaSlicer.icns is the *document* icon (a page with
          # "PROJECT" on it), OrcaSlicer.ico is the circular Windows one, which
          # looks wrong inside iOS's rounded-square mask, and all of them have
          # transparent margins, which iOS composites against black. The script
          # crops to the artwork, flattens onto its own background and rescales.
          python3 "$GITHUB_WORKSPACE/tools/ci/make-ios-icons.py" \
            orca/resources/images/OrcaSlicer_192px.png icons.xcassets
          xcrun actool icons.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target "$IOS_MIN" \
            --target-device ipad --target-device iphone \
            --app-icon AppIcon \
            --output-partial-info-plist icon-partial.plist
          # actool emits CFBundleIcons/CFBundleIconName describing what it just
          # compiled; without those keys the Assets.car is ignored and the home
          # screen shows the blank placeholder.
          python3 - "$APP/Info.plist" icon-partial.plist <<'MERGE'
          import plistlib, sys
          main_path, part_path = sys.argv[1], sys.argv[2]
          with open(main_path, 'rb') as fh: main = plistlib.load(fh)
          with open(part_path, 'rb') as fh: part = plistlib.load(fh)
          main.update(part)
          with open(main_path, 'wb') as fh: plistlib.dump(main, fh)
          print("merged icon keys:", sorted(part))
          MERGE
          test -f "$APP/Assets.car" || { echo "::error::actool produced no Assets.car"; exit 1; }

          # installd reads Info.plist through CFBundle and wants it in BINARY
          # plist format. A hand-written XML one parses fine with every other
          # tool -- plutil, plistlib, CFPropertyList -- and is then rejected at
          # install time with "Failed to get bundle ID ... Missing bundle ID",
          # which reads like the key is absent rather than the encoding wrong.
          # Xcode always emits binary, so a normal app never hits this.
          # Reproduced in the simulator (step-3 run 61) installing straight from
          # a directory, which ruled out zip ordering, payload size and AFC.
          plutil -convert binary1 "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          mkdir -p artifact
          OUT="$PWD/artifact/OrcaSlicer-iPad.ipa"
          # Info.plist and the executable go in FIRST, ahead of the ~15k files
          # under resources/. zip appends in the order given, so with resources
          # first the plist lands as the very last entry in the archive -- and an
          # installer whose extraction stops early (the bundle is ~370 MB
          # expanded) then produces an App.app with everything except the plist,
          # which reports as "Failed to get bundle ID / Missing bundle ID".
          # Ordering it first makes a truncated extraction fail loudly somewhere
          # else instead of in the one file the installer reads first.
          #
          # NOTE (2026-08-04): "Missing bundle ID" was in fact caused by the
          # bundle's top-level "resources" directory, not by truncation - see
          # ios-sim-probe.yml. The directory is now called orca-resources and
          # the ordering below is kept only because it costs nothing.
          (cd stage && zip -qr "$OUT" Payload/OrcaSlicer.app/Info.plist \
                                      Payload/OrcaSlicer.app/OrcaSlicer)
          (cd stage && zip -qr "$OUT" Payload)
          # A .dSYM anywhere in the bundle makes ldid assert on filetype
          # (MH_DSYM) and the sideload fails before the app is ever installed.
          if unzip -l "$OUT" | grep -q '\.dSYM'; then
            echo "::error::the IPA contains a .dSYM; ldid will refuse to sign it"
            exit 1
          fi
          # The icon is easy to lose silently: the bundle keeps building and
          # installing without it, and the only symptom is a blank home screen
          # tile that nobody notices until the app is on a device.
          unzip -l "$OUT" | grep -q 'Payload/OrcaSlicer.app/Assets.car' || {
            echo "::error::the IPA has no Assets.car; the app icon will be blank"
            exit 1
          }

          # ---- Info.plist variants, three IPAs from one compile ------------
          #
          # The iPad is handed a 1600x1200 point canvas on a panel that is
          # 2752x2064 physical: UIScreen reports scale 2 but nativeScale 1.72,
          # which is the signature of iOS running the app on a compatibility
          # canvas and downsampling it. wx 3.3.2's iPhone port has no UIScene
          # support at all, and iPadOS puts non-scene apps into exactly that
          # mode - so the fix is a bundle key, and there are three candidates.
          #
          # Testing one candidate per build is what has been costing an hour a
          # question. The plist is written AFTER the binary is linked, so extra
          # variants cost a re-zip and nothing else. Install one, read the
          # "orca-ios-display" line, and the question is answered.
          #
          #   -baseline : exactly what shipped before (control)
          #   -scene    : adds UIApplicationSceneManifest
          #   -windowed : drops UIRequiresFullScreen
          #
          # The bundle id is deliberately the same in all three, so installing
          # one over another keeps the data directory and the printer config.
          # Keep the baseline plist, not a fourth 171 MB copy of the IPA:
          # OrcaSlicer-iPad.ipa already *is* the baseline.
          cp "$APP/Info.plist" /tmp/Info.plist.baseline

          make_variant () {
            local name="$1"; shift
            python3 - "$APP/Info.plist" "$@" <<'MUTATE'
          import plistlib, sys
          path, mode = sys.argv[1], sys.argv[2]
          with open(path, 'rb') as fh:
              pl = plistlib.load(fh)
          if mode == 'scene':
              # Scenes alone are RULED OUT - run 82 shipped this and the log
              # still said 1600x1200 with nativeScale 1.72. Kept only as a
              # control. The live candidate is dropping UIRequiresFullScreen,
              # which iPadOS 26+ deprecated and which is documented to put an
              # app into a compatibility mode.
              pl['UIApplicationSceneManifest'] = {
                  'UIApplicationSupportsMultipleScenes': False,
              }
          elif mode == 'windowed':
              pl.pop('UIRequiresFullScreen', None)
          elif mode == 'both':
              pl['UIApplicationSceneManifest'] = {
                  'UIApplicationSupportsMultipleScenes': False,
              }
              pl.pop('UIRequiresFullScreen', None)
          with open(path, 'wb') as fh:
              plistlib.dump(pl, fh, fmt=plistlib.FMT_BINARY)
          MUTATE
            plutil -lint "$APP/Info.plist"
            local out="$PWD/artifact/OrcaSlicer-iPad-${name}.ipa"
            rm -f "$out"
            (cd stage && zip -qr "$out" Payload/OrcaSlicer.app/Info.plist \
                                        Payload/OrcaSlicer.app/OrcaSlicer)
            (cd stage && zip -qr "$out" Payload)
            echo "built variant $name"
          }

          # ALL THREE ARMS ARE NOW RULED OUT, and the default IPA is the
          # baseline again.
          #
          # Run 106 shipped the "both" arm as the default and the device log
          # from it says:
          #
          #   orca-ios-variant: sceneManifest yes, UIRequiresFullScreen no
          #   orca-ios-display (MainFrame): UIScreen.bounds 1600x1200,
          #     nativeBounds 2064x2752, scale 2, nativeScale 1.72
          #
          # unchanged from the baseline. Scenes alone died in run 82, and the
          # two together died in run 106, so the canvas is not a bundle key and
          # the variants have nothing left to answer.
          #
          # Shipping the scene arm by default now costs something concrete:
          # UIApplicationSceneManifest moves URL delivery from
          # -application:openURL:options: on the app delegate to
          # -scene:openURLContexts: on a scene delegate, and wx 3.3.2's iPhone
          # port has no UIScene support at all - so a MakerWorld deep link would
          # be handed to a delegate that does not exist. The baseline has no
          # manifest and gets the app-delegate callback, which is what patch
          # 0225 implements.
          #
          # The variants are still built, because they cost a re-zip and the
          # canvas question may yet come back with a different candidate.
          make_variant scene    scene
          cp /tmp/Info.plist.baseline "$APP/Info.plist"
          make_variant both     both
          cp "artifact/OrcaSlicer-iPad.ipa" "artifact/OrcaSlicer-iPad-baseline.ipa"
          # Rebuild the plist from the baseline before the last variant, so the
          # two changes are tested separately rather than stacking.
          cp /tmp/Info.plist.baseline "$APP/Info.plist"
          make_variant windowed windowed

          ls -lh artifact/

          # Verify the artifact the way an installer reads it, rather than
          # trusting that the zip did what was intended.
          rm -rf verify && mkdir verify
          unzip -q -o "$OUT" "Payload/OrcaSlicer.app/Info.plist" -d verify
          python3 - <<'VERIFY'
          import plistlib, sys
          with open('verify/Payload/OrcaSlicer.app/Info.plist','rb') as fh:
              d = plistlib.load(fh)
          bid = d.get('CFBundleIdentifier')
          exe = d.get('CFBundleExecutable')
          assert bid and exe, 'Info.plist is missing CFBundleIdentifier/CFBundleExecutable'
          print('IPA verified: bundle id %s, executable %s' % (bid, exe))
          # Deep links fail in a way nobody would connect to the bundle: Safari
          # just says the address is invalid. Check the schemes are actually in
          # the plist an installer reads, the same way the icon is checked.
          schemes = [s for t in d.get('CFBundleURLTypes', []) for s in t.get('CFBundleURLSchemes', [])]
          for want in ('bambustudio', 'bambustudioopen', 'orcaslicer'):
              assert want in schemes, 'Info.plist does not claim %s:// (has %s)' % (want, schemes)
          print('URL schemes verified: %s' % ', '.join(schemes))
          # The default IPA must NOT carry a scene manifest: it would route
          # openURL to a scene delegate the wx iPhone port does not have.
          assert 'UIApplicationSceneManifest' not in d, \
              'the default IPA has a scene manifest; deep links will not be delivered'
          VERIFY
          unzip -l "$OUT" | head -6

          # A second, minimal IPA for bisection. The full bundle is ~331 MB
          # across 15,557 files, and SideStore has rejected two structurally
          # valid IPAs with "Missing bundle ID" -- an error raised after
          # extraction, which points at the payload rather than the metadata.
          # This one is the executable and Info.plist only, ~120 MB and 3
          # entries. If it installs, the resources payload is the problem and
          # the fix is trimming it; if it fails identically, the payload is
          # innocent and the problem is the binary or the bundle shape.
          # It will NOT run correctly -- Orca needs resources/ at startup --
          # but it answers the install question.
          MINAPP=stage-min/Payload/OrcaSlicer.app
          rm -rf stage-min && mkdir -p "$MINAPP"
          cp "$APP/OrcaSlicer" "$MINAPP/OrcaSlicer"
          cp "$APP/Info.plist" "$MINAPP/Info.plist"
          MINOUT="$PWD/artifact/OrcaSlicer-iPad-minimal.ipa"
          (cd stage-min && zip -qr "$MINOUT" Payload)
          ls -lh artifact/

      - name: "[9/9] Upload + publish release"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ORCA_REF: ${{ github.event.inputs.orca_ref || '395e070a0e675fd4723f93967cefede730c482d9' }}
        run: |
          set -uxo pipefail
          # ci/publish_release.sh, taken from Toemeler/ipadprocad. Beyond the
          # IPA it writes source.json - an AltStore/SideStore source listing the
          # last ten builds - and latest.json, the flat manifest the iPad
          # Shortcut reads. Both go in the release, so the device side needs no
          # login and no artifact download. See docs/AUTOINSTALL.md.
          #
          # Still not fatal. Run 24 built, linked and packaged a clean device
          # IPA and was then marked failed because the release call returned
          # "HTTP 403: Resource not accessible by integration" - the token a
          # workflow_dispatch from an app integration gets cannot always create
          # a release, even with contents: write, though the same token pushes
          # ci-logs in the same job. The IPA is uploaded as a workflow artifact
          # either way, and that is the deliverable.
          # Keep the output. Being non-fatal is right - the IPA is uploaded as a
          # workflow artifact either way - but it also made the failure
          # invisible: run 109 was green from end to end and published nothing,
          # and the reason was in a job log that cannot be downloaded through
          # the egress proxy this repo is driven from. The publisher below picks
          # this file up, so the next failure names itself in ci-logs/.
          # The plist variants go in the release too, not just the artifact.
          #
          # The default IPA changed from the "both" arm to the baseline in the
          # same commit that added the deep links, and when the next build
          # crashed at launch there was no way to tell those two apart without
          # another hour of CI - the variants existed only as workflow
          # artifacts, which need a GitHub login to fetch and cannot be
          # installed from the iPad in two taps. A re-zip already produced them;
          # attaching them costs upload time and settles that class of question
          # with one tap instead of one build.
          if bash ci/publish_release.sh \
              artifact/OrcaSlicer-iPad.ipa \
              artifact/OrcaSlicer-iPad-minimal.ipa \
              artifact/OrcaSlicer-iPad-baseline.ipa \
              artifact/OrcaSlicer-iPad-both.ipa 2>&1 | tee /tmp/publish-release.log; then
            echo "published release orcaslicer-ipa-run${GITHUB_RUN_NUMBER}"
          else
            echo "::warning::could not create release; download the OrcaSlicer-iPad.ipa workflow artifact instead"
            echo "PUBLISH FAILED - see ci-logs/step4-run-${GITHUB_RUN_NUMBER}/publish-release.log"
          fi

      # The nudge to the iPad. A no-op without secrets - the build stays green,
      # the release is there regardless, and the Shortcut finds it on its own.
      # continue-on-error as well, because a push service being down must never
      # turn a good build red.
      - name: Notify iPad
        if: success()
        continue-on-error: true
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          bash ci/notify_build.sh \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/orcaslicer-ipa-run${GITHUB_RUN_NUMBER}/OrcaSlicer-iPad.ipa" \
            "${GITHUB_RUN_NUMBER}" \
            "$(git log -1 --pretty=%s)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orcaslicer-device-ipa
          path: artifact/
          if-no-files-found: ignore

      # The ccache numbers, on a run that WORKED.
      #
      # The step above already prints them, and the comment on it says they
      # "must be visible on a SUCCESSFUL run - straight to the job log". That
      # is not true in the environment these builds are actually driven from:
      # job log downloads and the Actions cache API are both blocked by the
      # egress proxy, so the only channel out of a green run is a commit. The
      # publisher below is `if: failure()`, which is why a green run has never
      # left a single ccache statistic behind, and why "did the cache come
      # back" has had to be inferred from step durations twice.
      #
      # Deliberately a separate step from that publisher rather than relaxing
      # its condition: the two are mutually exclusive, so they can never race
      # to commit in the same run, and this one stays small.
      - name: "Publish ccache stats to repo (ci-logs/)"
        if: success()
        run: |
          set -ux
          D="ci-logs/step4-run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$D"
          [ -f /tmp/ccache-restore.txt ] && cp /tmp/ccache-restore.txt "$D/ccache-restore.txt"
          # Why the release did or did not appear. This step runs on a GREEN
          # run, which is exactly when a failed publish is invisible: the step
          # that creates the release swallows its own failure on purpose.
          [ -f /tmp/publish-release.log ] && cp /tmp/publish-release.log "$D/publish-release.log"
          {
            echo "=== ccache -s after the build ==="
            ccache -s -v 2>/dev/null || ccache -s
            if [ -f "$HOME/ccache-step4.log" ]; then
              echo "=== results, ranked ==="
              grep -oE "Result: .*" "$HOME/ccache-step4.log" | sort | uniq -c | sort -rn | head -20
              echo "=== miss reasons, ranked ==="
              grep -oE "(Include file .* has changed|.*not found in manifest.*|No object file hash in manifest|Failed to .*|Disabling direct mode.*|.*pch.*)" "$HOME/ccache-step4.log" \
                | sed -E "s#/Users/runner[^ ]*/##" | sort | uniq -c | sort -rn | head -25
            fi
          } > "$D/ccache-stats.txt" 2>&1 || true
          git config user.name "ci-bot" && git config user.email "ci@users.noreply.github.com"
          git add -A ci-logs || true
          git commit -m "step4 ccache stats run ${GITHUB_RUN_NUMBER}" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" || true; git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      - name: "Publish failure logs to repo (ci-logs/)"
        if: failure()
        run: |
          set -ux
          D="ci-logs/step4-run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$D"
          # Why ccache missed, ranked. One line per distinct reason is
          # enough to tell "input changed" from "cache never consulted".
          if [ -f "$HOME/ccache-step4.log" ]; then
            {
              grep -oE "Result: .*" "$HOME/ccache-step4.log" | sort | uniq -c | sort -rn | head -20
              echo "--- sample miss context ---"
              grep -B60 -m1 "Result: cache_miss" "$HOME/ccache-step4.log" | tail -60
            echo "--- reasons, ranked ---"
            grep -oE "(Include file .* has changed|.*not found in manifest.*|No object file hash in manifest|Failed to .*|Disabling direct mode.*|.*pch.*)" "$HOME/ccache-step4.log" \
              | sed -E "s#/Users/runner[^ ]*/##" | sort | uniq -c | sort -rn | head -25
              echo "--- first compile command line (diff this against the previous run) ---"
              grep -m1 -A1 "Command line:" "$HOME/ccache-step4.log"
            } > "$D/ccache-miss-reasons.txt" 2>&1 || true
          fi
          for f in /tmp/step4-configure.log; do
            [ -f "$f" ] && tail -c 40000 "$f" > "$D/$(basename "$f")"
          done
          for f in /tmp/step4-ninja.log /tmp/wx-ninja.log /tmp/deps-ninja.log; do
            [ -f "$f" ] && grep -n -B3 -A60 -E "FAILED:|error:|Error [0-9]|Undefined symbols|ld: |symbol\(s\) not found|clang: error" "$f" | head -c 400000 > "$D/$(basename "$f" .log)-errors.log"
          done
          # Verbatim tail as well as the grep excerpt. A failing link prints one
          # enormous command line, which swallows the -A context before the
          # actual ld diagnosis is reached -- step-4 run 17 failed with neither
          # undefined nor duplicate symbols and the reason was simply not in
          # the captured excerpt.
          [ -f /tmp/step4-ninja.log ] && tail -n 200 /tmp/step4-ninja.log > "$D/step4-ninja-tail.log"
          if [ -f /tmp/step4-ninja.log ]; then
            {
              echo "=== FAILED targets ==="
              grep "FAILED:" /tmp/step4-ninja.log | sed -E "s#.*CMakeFiles/[^/]+\\.dir/##; s#\\.o .*##" | sort -u
              echo; echo "=== undefined symbols (linker) ==="
              grep -oE '"[^"]+", referenced from' /tmp/step4-ninja.log | sed -E 's/, referenced from//' | sort -u
              echo; echo "total FAILED: $(grep -c FAILED: /tmp/step4-ninja.log)"
              echo "undefined symbol count: $(grep -cE '"[^"]+", referenced from' /tmp/step4-ninja.log)"
            } > "$D/SUMMARY.txt"
          fi
          git config user.name "ci-bot" && git config user.email "ci@users.noreply.github.com"
          git add -A ci-logs || true
          git commit -m "step4 ci logs run ${GITHUB_RUN_NUMBER}" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" || true; git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
