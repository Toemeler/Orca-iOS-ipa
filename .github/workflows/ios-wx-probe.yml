name: wx widget probe (simulator)

# Why this exists
# ---------------
# Orca's MainFrame is built from a narrow set of wx classes - a book control, a
# wxDataViewCtrl, custom wxDC-painted windows, and a GL canvas driven by shaders.
# Whether the wxOSX/iPhone port renders those is the open question between "the
# app stays alive" and "the screenshot shows the UI", and answering it inside the
# Orca build costs 55 minutes per attempt.
#
# The wx prefix is already cached on this branch, so building a probe against it
# takes about a minute. This restores that cache, compiles wx-probe/, and runs it
# through the same launch verification the step-3 workflows use: alive-polled,
# screenshotted while running, and red if it dies.
#
# Runs in its own concurrency group, so it can go while a step-3 build is busy.

on:
  # A workflow file that exists only on a feature branch cannot be dispatched by
  # the API - GitHub resolves the name against the default branch and returns
  # 404. The push trigger is how this one gets started until it lands on main;
  # the paths keep ci-log commits from re-running it.
  push:
    branches:
      - claude/lan-backend-implementation-gxu2jr
    paths:
      - '.github/workflows/ios-wx-probe.yml'
      - 'wx-probe/**'
      - 'tools/ci/sim-launch-verify.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wx-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      IOS_MIN: "17.0"
      PREFIX: ${{ github.workspace }}/ios-prefix
      WXPREFIX: ${{ github.workspace }}/wx-prefix
      SDK: iphonesimulator

    steps:
      - uses: actions/checkout@v4

      # Same key derivation as ios-step3-fast.yml, so this restores the very wx
      # build Orca is linked against rather than some other one.
      - name: Compute wx cache key
        run: |
          set -euxo pipefail
          WXH=$({ find wx-overlay -type f | LC_ALL=C sort; cat $(find wx-overlay -type f | LC_ALL=C sort) patches/step2/*.patch; } | shasum | cut -c1-12)
          echo "WX_KEY=ios-wxprefix-v4-$WXH" >> "$GITHUB_ENV"

      - name: Restore wx cache (required)
        uses: actions/cache/restore@v4
        with:
          path: wx-prefix
          key: ${{ env.WX_KEY }}

      - name: Restore deps cache (optional)
        uses: actions/cache/restore@v4
        with:
          path: ios-prefix
          key: ios-prefixonly-v1
          restore-keys: |
            ios-prefixonly-v1
            ios-deps-v1-

      # Build the prefix rather than demand one.
      #
      # This used to hard-fail when the cache missed, which tied the probe to
      # whichever branch had last run step 3: Actions caches are readable from
      # the branch that wrote them and from the default branch only, so a probe
      # dispatched on main could never find a prefix a feature branch had built.
      # The wx build is ~5 minutes against an already-cloned tree, and the
      # result is saved under the same key step 3 uses, so paying it once on a
      # branch makes every later run there a cache hit.
      - name: Build wx prefix if the cache missed
        run: |
          set -euxo pipefail
          if [ -d "$WXPREFIX/lib" ]; then
            echo "wx prefix restored from cache"
            ls "$WXPREFIX"/lib/libwx*.a | head
          else
            echo "no wx prefix in the cache - building it"
            brew install ninja >/dev/null 2>&1 || true
            git clone --recurse-submodules https://github.com/SoftFever/Orca-deps-wxWidgets.git wx
            cd wx && git checkout v3.3.2 && git submodule update --init --recursive
            shopt -s nullglob
            for p in "$GITHUB_WORKSPACE"/patches/step2/*.patch; do git apply --verbose "$p"; done
            cp -r "$GITHUB_WORKSPACE"/wx-overlay/include/. include/
            cp -r "$GITHUB_WORKSPACE"/wx-overlay/src/. src/
            # Same feature flags as ios-step3-gui.yml so this prefix answers for
            # the one Orca is linked against. The JPEG pinning is the exception:
            # it exists to stop wx's builtin libjpeg colliding with the deps
            # stack's on Orca's link line, and it is only applied when the deps
            # prefix is actually present. A standalone probe links neither.
            JPEG_ARGS=""
            if [ -f "$PREFIX/usr/local/lib/libjpeg.a" ]; then
              JPEG_ARGS="-DwxUSE_LIBJPEG=sys
                         -DJPEG_LIBRARY=$PREFIX/usr/local/lib/libjpeg.a
                         -DJPEG_LIBRARY_RELEASE=$PREFIX/usr/local/lib/libjpeg.a
                         -DJPEG_INCLUDE_DIR=$PREFIX/usr/local/include"
            fi
            mkdir -p build-ios && cd build-ios
            cmake .. -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$SDK \
              -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
              -DIPHONE=ON -DwxBUILD_TOOLKIT=osx_iphone \
            -DCMAKE_BUILD_TYPE=Release \
              -DwxBUILD_SHARED=OFF -DwxBUILD_PRECOMP=OFF -DwxBUILD_SAMPLES=OFF \
              -DwxUSE_OPENGL=ON -DwxUSE_WEBVIEW=ON -DwxUSE_XRC=OFF \
              -DwxUSE_MEDIACTRL=OFF -DwxUSE_SECRETSTORE=OFF \
              -DwxUSE_GRID=ON -DwxUSE_LISTCTRL=ON -DwxUSE_IMAGLIST=ON \
              -DwxUSE_AUI=ON -DwxUSE_COMBOBOX=ON \
              -DwxUSE_DATAOBJ=ON -DwxUSE_DRAG_AND_DROP=ON \
              -DwxUSE_CLIPBOARD=ON -DwxUSE_TOOLTIPS=ON \
              -DwxUSE_NANOSVG=OFF -DwxUSE_LOGWINDOW=ON \
              $JPEG_ARGS \
              -DCMAKE_INSTALL_PREFIX="$WXPREFIX" > /dev/null
            ninja -k 0 > /tmp/wx-ninja.log 2>&1 || (tail -80 /tmp/wx-ninja.log && exit 1)
            ninja install > /tmp/wx-install.log 2>&1 || (tail -60 /tmp/wx-install.log && exit 1)
            cd "$GITHUB_WORKSPACE"
            WXINC=$(find "$WXPREFIX/include" -maxdepth 1 -name "wx-*" -type d | head -1)
            [ -n "$WXINC" ] || WXINC="$WXPREFIX/include"
            mkdir -p "$WXINC/wx/generic/private" "$WXINC/wx/private" "$WXINC/wx/osx"
            cp -R wx/include/wx/generic/private/. "$WXINC/wx/generic/private/" || true
            cp -R wx/include/wx/private/. "$WXINC/wx/private/" || true
            cp wx/include/wx/webview.h wx/include/wx/webviewarchivehandler.h \
               wx/include/wx/webviewfshandler.h "$WXINC/wx/" || true
            cp wx/include/wx/osx/webviewhistoryitem_webkit.h "$WXINC/wx/osx/" || true
            echo "WX_BUILT_HERE=1" >> "$GITHUB_ENV"
          fi
          # the overlay headers ship into the prefix the same way step 3 does
          WXINC=$(find "$WXPREFIX/include" -maxdepth 1 -name "wx-*" -type d | head -1)
          cp -r wx-overlay/include/wx "$WXINC/" 2>/dev/null || true

      - name: Save wx prefix cache
        if: env.WX_BUILT_HERE == '1'
        uses: actions/cache/save@v4
        with:
          path: wx-prefix
          key: ${{ env.WX_KEY }}

      - name: Build WxProbe.app
        run: |
          set -euxo pipefail
          chmod +x wx-probe/build.sh
          ./wx-probe/build.sh "$WXPREFIX" "$SDK" "$IOS_MIN" "$PREFIX" 2>&1 | tee /tmp/wx-probe-build.log
          file wx-probe/build/WxProbe.app/WxProbe

      # Publish the build log the moment the build fails, rather than after the
      # simulator steps. Job log downloads are blocked in this environment, so
      # ci-logs is the only channel -- and routing it through the end of the job
      # has now cost three rounds: a cancelled run skips it entirely, and a
      # healthy one delays it by the control step's fourteen minutes.
      - name: Publish the build log immediately if the build failed
        if: failure()
        run: |
          set -ux
          D="ci-logs/wx-probe-run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$D"
          # In full: the interesting errors are from the *first* link attempt,
          # at the top of the file, and a tail cuts exactly those off.
          cp /tmp/wx-probe-build.log "$D/wx-probe-build.log" 2>/dev/null || true
          grep -nE "error:|Undefined symbols|symbol\(s\) not found|PROBE_BUILD=|PROBE_DELEGATE=" \
            /tmp/wx-probe-build.log > "$D/build-errors.txt" 2>&1 || true
          cat "$D/build-errors.txt" || true
          git config user.name "ci-bot" && git config user.email "ci@users.noreply.github.com"
          git add -A ci-logs || true
          git commit -m "wx probe run ${GITHUB_RUN_NUMBER} - build failure logs" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      - name: Launch in iPad simulator + screenshot
        # A stuck simctl must not eat the job. The launch itself is bounded by
        # sim-launch-verify's own checkpoints (~2 minutes); everything past that
        # is simulator create/boot, and when that wedges it wedges for good --
        # one run sat in the control step for 35 minutes and had to be killed,
        # losing the build log it would have published on a normal failure.
        timeout-minutes: 14
        env:
          # The probe either renders in the first seconds or dies; a 67-second
          # window buys nothing here and the loop is the point.
          SIM_CHECKPOINTS: "2 6 14"
        run: |
          set -euxo pipefail
          mkdir -p artifact
          bash tools/ci/sim-launch-verify.sh \
            wx-probe/build/WxProbe.app org.orca-ios.wxprobe "$PWD/artifact"

      # Control experiment. smoke-app/ is the step-2 proof that this port
      # renders: a frame, a button and a wxGLCanvas cleared to green, screenshot
      # and all. Building it from the same cached prefix separates the two
      # explanations for a probe that dies - my choice of widgets, or a wx prefix
      # that no longer starts an app at all. Never fails the job; it is evidence,
      # not a gate.
      - name: Control - the step-2 smoke app
        if: always()
        timeout-minutes: 14
        env:
          SIM_CHECKPOINTS: "2 6"
        run: |
          set -uxo pipefail
          chmod +x smoke-app/build.sh
          ./smoke-app/build.sh "$WXPREFIX" "$SDK" "$IOS_MIN" 2>&1 | tee /tmp/smoke-build.log || exit 0
          mkdir -p artifact-smoke
          bash tools/ci/sim-launch-verify.sh \
            smoke-app/build/WxSmoke.app org.orca-ios.wxsmoke "$PWD/artifact-smoke" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wx-probe
          path: artifact/
          if-no-files-found: ignore

      - name: Publish to ci-logs
        if: always()
        run: |
          set -ux
          D="ci-logs/wx-probe-run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$D"
          cp artifact/*.png "$D/" 2>/dev/null || true
          for f in artifact-smoke/*.png; do
            [ -e "$f" ] && cp "$f" "$D/smoke-$(basename "$f")"
          done 2>/dev/null || true
          for f in launch-verdict.txt sim-launch.log sim-oslog.txt alive-methods.txt orca-app-log.txt crash-reports.txt; do
            [ -f "artifact-smoke/$f" ] && tail -c 20000 "artifact-smoke/$f" > "$D/smoke-$f"
          done
          [ -f /tmp/smoke-build.log ] && tail -c 8000 /tmp/smoke-build.log > "$D/smoke-build.log"
          for f in artifact/launch-verdict.txt artifact/screenshot-stats.txt \
                   artifact/sim-launch.log artifact/sim-oslog.txt \
                   artifact/orca-app-log.txt artifact/alive-methods.txt \
                   artifact/crash-reports.txt \
                   /tmp/wx-probe-build.log; do
            [ -f "$f" ] && tail -c 20000 "$f" > "$D/$(basename "$f")"
          done
          git config user.name "ci-bot" && git config user.email "ci@users.noreply.github.com"
          git add -A ci-logs || true
          git commit -m "wx probe run ${GITHUB_RUN_NUMBER}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
